<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIO X MD - Pair</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;background:#0a0a0f;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .container{max-width:420px;width:100%}
        .logo{text-align:center;font-size:2.5rem;font-weight:800;background:linear-gradient(135deg,#6c5ce7,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:3px}
        .sub{text-align:center;color:#a0a0b0;font-size:.85rem;margin-bottom:20px}
        .card{background:#1a1a2e;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:22px}
        .tabs{display:flex;gap:6px;margin-bottom:18px;background:rgba(255,255,255,.03);padding:4px;border-radius:10px}
        .tab{flex:1;padding:10px;border:none;background:0 0;color:#a0a0b0;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:600;text-align:center}
        .tab.active{background:linear-gradient(135deg,#6c5ce7,#a855f7);color:#fff}
        .content{display:none}
        .content.active{display:block}
        .inp{margin-bottom:12px}
        .inp label{display:flex;align-items:center;gap:5px;margin-bottom:6px;color:#a0a0b0;font-size:.8rem}
        .wrap{display:flex;gap:6px}
        select,input{padding:11px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#fff;font-size:.95rem;font-family:inherit}
        select{min-width:95px}
        input{flex:1}
        input:focus,select:focus{outline:0;border-color:#6c5ce7}
        .btn{width:100%;padding:13px;background:linear-gradient(135deg,#6c5ce7,#a855f7);color:#fff;border:none;border-radius:10px;font-size:.9rem;font-weight:600;cursor:pointer}
        .btn:disabled{opacity:.6}
        .status{margin-top:12px;padding:10px;background:rgba(255,255,255,.03);border-radius:10px;display:none;align-items:center;gap:8px;font-size:.8rem;color:#a0a0b0}
        .status.show{display:flex}
        .spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:#6c5ce7;border-radius:50%;animation:s .8s linear infinite;display:inline-block}
        @keyframes s{to{transform:rotate(360deg)}}
        .codebox{margin-top:12px;padding:18px;background:rgba(108,92,231,.1);border:2px solid #6c5ce7;border-radius:14px;text-align:center;display:none}
        .codebox.show{display:block}
        .codenum{font-size:2.3rem;font-weight:800;letter-spacing:8px;color:#a855f7;font-family:monospace;margin:8px 0}
        .info{text-align:left;margin-top:10px;padding:10px;background:rgba(0,0,0,.3);border-radius:10px;font-size:.78rem}
        .info ol{margin:6px 0 0 16px}
        .info li{margin-bottom:5px;color:#a0a0b0}
        .qrbox{margin-top:12px;text-align:center;display:none}
        .qrbox.show{display:block}
        .qrimg{display:inline-block;padding:12px;background:#fff;border-radius:12px}
        .qrimg canvas{display:block;width:200px;height:200px}
        .stats{display:flex;justify-content:space-around;margin-top:12px;padding:10px;background:#1a1a2e;border-radius:10px;border:1px solid rgba(255,255,255,.1)}
        .st{text-align:center}
        .stv{font-size:1.2rem;font-weight:700;color:#6c5ce7}
        .stl{font-size:.7rem;color:#a0a0b0}
        .toast{position:fixed;bottom:20px;right:20px;background:#1a1a2e;border:1px solid rgba(255,255,255,.1);padding:10px 18px;border-radius:10px;display:flex;align-items:center;gap:6px;transform:translateX(200%);transition:.3s;z-index:1000;font-size:.85rem}
        .toast.show{transform:translateX(0)}
        .toast.ok{border-color:#00b894}
        .toast.err{border-color:#e17055}
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">RIO X MD</div>
        <p class="sub">WhatsApp Multi-Device Bot</p>
        
        <div class="card">
            <div class="tabs">
                <button class="tab active" onclick="sw('pair')">🔑 Pair Code</button>
                <button class="tab" onclick="sw('qr')">📱 QR Code</button>
            </div>

            <div id="pairTab" class="content active">
                <div class="inp">
                    <label>📱 WhatsApp Number</label>
                    <div class="wrap">
                        <select id="cc"><option value="94">🇱🇰 +94</option><option value="91">🇮🇳 +91</option><option value="1">🇺🇸 +1</option><option value="44">🇬🇧 +44</option></select>
                        <input id="phone" placeholder="7XXXXXXXX" maxlength="10">
                    </div>
                </div>
                <button class="btn" id="pBtn" onclick="getPair()">🔑 Get Pairing Code</button>
                <div id="pStat" class="status"><span class="spin"></span><span id="pMsg">Connecting...</span></div>
                <div id="codeBox" class="codebox">
                    <p style="color:#00b894">✅ Your Code:</p>
                    <div class="codenum" id="codeTxt">------</div>
                    <div class="info"><strong>Steps:</strong><ol><li>Open WhatsApp</li><li>Settings > Linked Devices</li><li>Tap "Link a Device"</li><li>Enter code</li></ol></div>
                </div>
            </div>

            <div id="qrTab" class="content">
                <p style="text-align:center;color:#a0a0b0;margin-bottom:12px;font-size:.85rem">Click to generate QR</p>
                <button class="btn" id="qBtn" onclick="getQR()">📱 Generate QR</button>
                <div id="qStat" class="status" style="margin-top:12px"><span class="spin"></span><span>Generating...</span></div>
                <div id="qrBox" class="qrbox"><div class="qrimg" id="qrImg"></div><p style="margin-top:8px;color:#a0a0b0;font-size:.8rem">Scan with WhatsApp</p></div>
            </div>
        </div>

        <div class="stats">
            <div class="st"><div class="stv" id="users">0</div><div class="stl">Active</div></div>
            <div class="st"><div class="stv" id="ram">0</div><div class="stl">RAM MB</div></div>
            <div class="st"><div class="stv">🟢</div><div class="stl">Online</div></div>
        </div>
    </div>

    <div id="toast" class="toast"><span id="tIcon">✅</span><span id="tMsg"></span></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script>
        const socket = io({ transports: ['websocket', 'polling'] });

        function sw(t) {
            document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            if (t === 'pair') {
                document.querySelector('.tab:first-child').classList.add('active');
                document.getElementById('pairTab').classList.add('active');
            } else {
                document.querySelector('.tab:last-child').classList.add('active');
                document.getElementById('qrTab').classList.add('active');
            }
        }

        async function loadStats() {
            try {
                const r = await fetch('/api/stats');
                const d = await r.json();
                document.getElementById('users').textContent = d.active || 0;
                document.getElementById('ram').textContent = d.memory || 0;
            } catch(e) {}
        }
        loadStats();
        setInterval(loadStats, 8000);
        socket.on('stats', d => {
            document.getElementById('users').textContent = d.active || 0;
            document.getElementById('ram').textContent = d.memory || 0;
        });

        function getPair() {
            const phone = document.getElementById('cc').value + document.getElementById('phone').value.replace(/\D/g, '');
            if (phone.length < 11) return toast('Enter valid number!', 'err');

            const btn = document.getElementById('pBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spin"></span> Wait...';
            document.getElementById('pStat').classList.add('show');
            document.getElementById('codeBox').classList.remove('show');

            socket.emit('pair', phone);

            socket.on('log', m => document.getElementById('pMsg').textContent = m);
            socket.on('code', c => {
                document.getElementById('pStat').classList.remove('show');
                document.getElementById('codeBox').classList.add('show');
                document.getElementById('codeTxt').textContent = (c || '').match(/.{1,4}/g)?.join(' ') || c;
                btn.disabled = false;
                btn.innerHTML = '🔑 Get Pairing Code';
                toast('Code ready!', 'ok');
            });
            socket.on('error', m => {
                document.getElementById('pStat').classList.remove('show');
                btn.disabled = false;
                btn.innerHTML = '🔑 Get Pairing Code';
                toast(m, 'err');
            });
        }

        function getQR() {
            const btn = document.getElementById('qBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spin"></span> Wait...';
            document.getElementById('qStat').classList.add('show');
            document.getElementById('qrBox').classList.remove('show');

            socket.emit('qrcode');

            socket.on('qr', q => {
                document.getElementById('qStat').classList.remove('show');
                document.getElementById('qrBox').classList.add('show');
                const c = document.createElement('canvas');
                QRCode.toCanvas(c, q, { width: 200 }, e => {
                    if (!e) { document.getElementById('qrImg').innerHTML = ''; document.getElementById('qrImg').appendChild(c); }
                });
                btn.disabled = false;
                btn.innerHTML = '📱 Generate QR';
                toast('QR ready!', 'ok');
            });
            socket.on('done', () => {
                document.getElementById('qStat').classList.remove('show');
                document.getElementById('qrBox').classList.remove('show');
                btn.disabled = false;
                btn.innerHTML = '📱 Generate QR';
                toast('Connected!', 'ok');
            });
        }

        function toast(m, t) {
            const el = document.getElementById('toast');
            document.getElementById('tMsg').textContent = m;
            document.getElementById('tIcon').textContent = t === 'ok' ? '✅' : '❌';
            el.className = `toast ${t} show`;
            clearTimeout(el._t);
            el._t = setTimeout(() => el.classList.remove('show'), 3000);
        }

        document.getElementById('phone').addEventListener('input', function(e) {
            this.value = this.value.replace(/\D/g, '').slice(0, 10);
        });
    </script>
</body>
</html>
